# Publish workflow for the Mahabbat app.
#
# Distribution status: NOT DISTRIBUTED (see docs/DISTRIBUTION_DECISION.md — the
# authoritative record, maintained by the product owner).
#
# The real publish step is impossible while the fail-closed distribution gate
# below is `false`. The gate is a hard value committed in this workflow file; a
# version tag cannot change it. Enabling distribution requires a deliberate PR
# that flips the gate to `true` AND updates docs/DISTRIBUTION_DECISION.md.
#
# There is intentionally no automatic `push`/tag trigger: a `v*` tag never
# starts a publication.
name: Publish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact version to verify against package.json (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC provenance). Kept declared only so
  # an explicit distribution decision does not require a separate permission PR.
  id-token: write

env:
  DISTRIBUTION_ENABLED: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Distribution gate (fail-closed)
        shell: bash
        run: |
          if [ "$DISTRIBUTION_ENABLED" != "true" ]; then
            echo "::error::distribution is frozen (docs/DISTRIBUTION_DECISION.md = NOT DISTRIBUTED); publication is disabled"
            exit 1
          fi
          echo "distribution enabled"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # Trusted publishing requires npm 11.5.1 or later. Pin a fixed version
        # instead of `latest` so the toolchain is reproducible.
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify version gate
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="${{ github.event.inputs.release_version }}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::package.json version ($VERSION) does not match the requested release ($EXPECTED)"
            exit 1
          fi
          echo "version gate ok: v$VERSION"

      - name: Publish to npm
        # Cannot run while the distribution gate is `false`.
        # Uncomment if publishing from a private source repo: npm rejects
        # OIDC provenance for private repos
        # env:
        #   TWENTY_APP_PUBLISH_DISABLE_PROVENANCE: 'true'
        run: yarn twenty app:publish