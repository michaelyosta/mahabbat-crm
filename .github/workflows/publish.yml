# Publishes the app to npm with provenance (npm trusted publishing).
#
# One-time setup:
# 1. On npmjs.com open your package > Settings > Trusted Publisher and register
#    this repository and this workflow file (publish.yml).
#    See https://docs.npmjs.com/trusted-publishers
# 2. Push a version tag (e.g. `git tag v0.1.0 && git push --tags`) or run the
#    workflow manually from the Actions tab.
#
# Safety gate: the publish step only runs when the requested version exactly
# matches package.json `version` (see "Verify version gate" step). This
# prevents accidental releases from mismatched tags/dispatches.
#
# Distribution status: see docs/DISTRIBUTION_DECISION.md — this app is NOT
# distributed; the gate is a guardrail, not an active publishing pipeline.
#
# Publishing with provenance certifies which GitHub repository the package is
# built from. This is also how you claim ownership of your app in a Twenty
# marketplace: the claim flow verifies you own the GitHub account or
# organization the provenance points to.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact version to publish (must equal package.json version, e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC provenance).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # Trusted publishing requires npm 11.5.1 or later. Pin a fixed version
        # instead of `latest` so the toolchain is reproducible.
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify version gate
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            EXPECTED="${{ github.event.inputs.release_version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            EXPECTED="${TAG#v}"
          fi
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::package.json version ($VERSION) does not match the requested release ($EXPECTED)"
            exit 1
          fi
          echo "Publishing v$VERSION (gate ok)"

      - name: Publish to npm
        # Gated by the "Verify version gate" step above; will not run on a mismatch.
        # Uncomment if publishing from a private source repo: npm rejects
        # OIDC provenance for private repos
        # env:
        #   TWENTY_APP_PUBLISH_DISABLE_PROVENANCE: 'true'
        run: yarn twenty app:publish